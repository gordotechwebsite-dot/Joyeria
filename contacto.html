<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto | MicGlier Jewelry — Barcelona</title>
  <meta name="description" content="Contacta con MicGlier Jewelry en Barcelona. Visítanos en Passeig de Gràcia o escríbenos para una consulta gratuita." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="contacto" data-root=".">

  <div id="pageContent">

  <!-- Page Header -->
  <section class="page-hero">
    <div class="page-hero__container">
      <h1 class="page-hero__title"><span class="text-gold">Contacto</span></h1>
      <p class="page-hero__desc">Estamos aquí para ayudarte. Consulta gratuita y sin compromiso.</p>
    </div>
  </section>

  <!-- Contact Section -->
  <section class="contact" id="contacto">
    <div class="contact__container">
      <div class="contact__info">
        <span class="contact__tag">ENCUÉNTRANOS</span>
        <h2 class="contact__title">Visítanos en <span class="text-gold">Barcelona</span></h2>
        <div class="contact__details">
          <div class="contact__detail">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <div>
              <strong>Dirección</strong>
              <span>Passeig de Gràcia, 08007 Barcelona</span>
            </div>
          </div>
          <div class="contact__detail">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
            <div>
              <strong>Teléfono</strong>
              <a href="tel:+34600000000">+34 600 000 000</a>
            </div>
          </div>
          <div class="contact__detail">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <div>
              <strong>Email</strong>
              <a href="mailto:info@micglierjewelry.com">info@micglierjewelry.com</a>
            </div>
          </div>
          <div class="contact__detail">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <div>
              <strong>Horario</strong>
              <span>Lun - Sáb: 10:00 - 20:00</span>
            </div>
          </div>
        </div>
      </div>
      <div class="contact__form-wrapper">
        <form class="contact__form" id="contactForm">
          <h3>Envíanos un Mensaje</h3>
          <div class="form-row">
            <input type="text" placeholder="Nombre completo" required />
            <input type="email" placeholder="Email" required />
          </div>
          <input type="tel" placeholder="Teléfono" />
          <select>
            <option value="">Selecciona un servicio</option>
            <option value="compra">Comprar Joya</option>
            <option value="mantenimiento">Mantenimiento</option>
            <option value="personalizado">Diseño Personalizado</option>
            <option value="otro">Otro</option>
          </select>
          <textarea rows="4" placeholder="Tu mensaje..."></textarea>
          <button type="submit" class="btn btn--gold btn--full">Enviar Mensaje</button>
        </form>
      </div>
    </div>
  </section>

  </div>

  <script>window.MICGLIER_API = '';</script>
  <script src="assets/js/shared.js"></script>
  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/dynamic.js" defer></script>
</body>
</html>
